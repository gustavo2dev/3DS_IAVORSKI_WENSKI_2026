    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>atv3</title>
    <script>
        class Calculadora {
            somar(a, b){
                return a + b;
            }
            subtrair(a, b){
                return a - b;
            }
        }
        const calc = new Calculadora();
        console.log(`\n ${calc.somar(3, 2)} \n ${calc.subtrair(3, 2)}`);
    </script>
