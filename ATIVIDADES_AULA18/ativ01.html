<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1: A Tranca Básica - Termometro</title>
    <script>
        class Termometro{
            #temperatura = 0;
                
            constructor(temperatura){
                this.#temperatura = temperatura;    
            }

            get temperatura(){
                return this.#temperatura;
            }

            set temperatura(novaTemperatura){
                if(typeof novaTemperatura === "number"){
                    this.#temperatura = novaTemperatura;
                    console.log(`A temperatura é ${novaTemperatura}`);
                } else{
                    console.error("tentativa de alteração bloqueada.");
                }
            }
        }

        const temperatura_1 = new Termometro(50);
        console.log("Temperatura inicial", temperatura_1.temperatura);
        console.log("Tente usar temperatura_1.temperatura = ",""," ;");
        console.log(temperatura_1.temperatura = "string kkkkkk");
    </script>
</head>

</body>
</html>
