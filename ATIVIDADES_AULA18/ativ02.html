<!doctype html>
<html lang="pr-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>O Filtro de Valores - Estoque</title>
    <script>
      class ControleDeEstoque {
        #quantidade = 0;

        constructor(estoque) {
          this.#quantidade = estoque;
        }

        get quantidade() {
          return this.#quantidade;
        }

        set quantidade(novaQuantidade) {
          if (typeof novaQuantidade === "number" && novaQuantidade >= 0) {
            this.#quantidade = novaQuantidade;
            console.log(`O estoque é ${novaQuantidade}`);
          } else {
            console.error("O estoque não pode ser negativo!");
          }
        }
      }

      const estoque = new ControleDeEstoque(50);

      console.log("O valor inicial é:", estoque.quantidade);
      estoque.quantidade = -50; // mostra erro e não altera
      console.log("O valor final é", estoque.quantidade);
    </script>
  </head>
  <body></body>
</html>
