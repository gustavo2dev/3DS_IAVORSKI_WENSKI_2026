<!DOCTYPE html>
<html lang="pr-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Filtro de Valores - Estoque</title>
    <script>
        class ControleDeEstoque{
            #quantidade = 0;

            constructor(estoque){
                this.#quantidade = estoque;
            }

            get quantidade(){
                return this.#quantidade;
            }

            set quantidade(novaQuantidade){
                if(typeof novaQuantidade === 'number' && novaQuantidade >= 0){
                    this.#quantidade = novaQuantidade;
                    console.log(`O estoque é ${novaQuantidade}`);
                }else{
                    console.error("O estoque não pode ser negativo!");
                }
            }
        }

        const estoque1 = new ControleDeEstoque(50);
        console.log(`Valor em estoque: ${estoque1.quantidade}`);
        console.log("estoque1.quantidade = 30;  Deve exibir que o estoque é 30")
        console.log("estoque1.quantidade = -5;   deve exibir: Erro O estoque não pode ser negativo!")
    </script>
</head>
<body>
    
</body>
</html>
