<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Cofre Inteligente - Cofre do Ciricascudo</title>
    <script>
        class Cofre{
            #saldo = 0;
            #historico = [];

            constructor(saldo){
                this.saldo = saldo;
            }

            set saldo(novoSaldo){
                if( typeof novoSaldo === "number"){
                    this.#saldo = novoSaldo;
                    this.#historico.push(`Saldo alterado para ${novoSaldo}`);
                }else{
                    console.error("Valor inválido!");
                }
            }

            extrato(){
                console.log(this.#historico);
            }
        }

        const valor = new Cofre(100);
        valor.saldo = 600;

        console.log("            Exemplo de Uso:            \n const cofre = new Cofre(100); \n cofre.saldo = 250; \n cofre.extrato(); \n  Consulte também: valor.extrato()");    
    </script>
</head>

</body>
</html>
