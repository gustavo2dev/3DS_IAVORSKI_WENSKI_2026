<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objeto Literal</title>
    <script>
        const pessoa = {
            nome: "Maria",
            idade: 25,
            cumprimentar() {
                console.log(`Olá eu sou ${this.nome}!`);
            }
        };
        pessoa.cumprimentar();// Olá eu sou Maria!
    </script>
</head>

</body>
