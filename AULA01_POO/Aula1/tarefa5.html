<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarefa5</title>
    <script>
        class Circulo {
            constructor(raio) {
                this.raio = raio;
            }
            
            calcularArea() {
                return Math.PI * this.raio * this.raio;
            }
        }
        
        const circulo = new Circulo(5);
        console.log(`Área do círculo: ${circulo.calcularArea()}`);
    </script>
</head>
