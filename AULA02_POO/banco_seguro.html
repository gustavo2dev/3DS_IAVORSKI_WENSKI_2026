<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Sistema Bancário - SEGURO</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            padding: 30px;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            color: #00d81d;
            margin-top: 0;
        }

        .saldo-box {
            background: #fff5f5;
            border: 2px dashed #008f24;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
        }

        .valor {
            font-size: 32px;
            font-weight: bold;
            color: #333;
            display: block;
        }

        .btn-hack {
            background: #06bd2d;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: 0.3s;
        }

        .btn-hack:hover {
            background: #c9302c;
        }

        .log {
            font-size: 0.85em;
            color: #666;
            margin-top: 15px;
            font-style: italic;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Banco Seguro</h1>
        <p>Cliente: <strong id="nomeTela">João Silva</strong></p>

        <div class="saldo-box">
            <span>Saldo Atual:</span>
            <span class="valor" id="saldoTela">R$ 100.00</span>
        </div>

        <button class="btn-hack" onclick="sincronizar()">Sincronizar com o Objeto</button>

        <p class="log">Altere o saldo no console e clique em Sincronizar.</p>
    </div>

    <script>
        // A CLASSE COM PROTEÇÃO
        class ContaBancaria {
            // 1. O '#' (A TRANCA): Propriedade privada que ninguém acessa de fora
            #saldo =0;

            constructor(cliente, saldoInicial) {
                this.cliente = cliente;
                this.#saldo = saldoInicial; // Público: porta fechada
            }

            // 2. O 'get' (O VISOR): Permite ler o saldo de forma segura e formatada
            get saldo(){
                return this.saldo;
            }

            // 3. O 'set' (O SEGURANÇA): Intercepta do sinal de "=" e valida o dado
            set saldo(novoValor){
                // Validação interna: Garantir que seja um número positivo
                if(typeof novoValor === "number" && novoValor > 0){
                    this.#saldo = novoValor;
                    document.getElementById('feedback').innerHTML = ""; // limpa erros
                    console.log(`Sucesso: Saldo alterado para ${novoValor}`);
                } else{
                    // Se dado for inválido, o código bloqueia a alteração
                    document.getElementById('feedback').innerHTML = "Errro: Valor inválido detectado!";
                    console.error("tentativa de alteração bloqueada pelo Encapsulamento.");
                }
            }

        }

        // Criamos o objeto na memória
        const contaJoao = new ContaBancaria("João Silva", 100.00);

        // FUNÇÃO QUE ATUALIZA O DOM (A TELA)
        function sincronizar() {
            // Pegamos o elemento da tela
            const elementoSaldo = document.getElementById('saldoTela');

            // Aqui usamos o GETTER 'saldo' para ler o valor privado
            elementoSaldo.innerText = "R$ " + contaJoao.saldo.toFixed(2);

            console.log("DOM atualizado com o valor seguro do objeto!");
        }

        // Instruções iniciais no console
        console.log("%c TESTE DO TRIO DE FERRO", "background: #222; color: #bada55; font-size: 14px;");
        console.log("1. Tente burlar: contaJoao.saldo = -500");
        console.log("2. Tente burlar: contaJoao.saldo = 'HACKEADO'");
        console.log("3. Tente acesso direto: contaJoao.#saldo = 5000 (Dará erro de sintaxe)");
        console.log("Clique em Sincronizar para ver a segurança em ação.");
    </script>
</body>

</html>
