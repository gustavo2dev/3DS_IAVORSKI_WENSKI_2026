<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CONTATOS</title>

    <style>
      body {
        background-color: #000000;
        color: #ffffff;
        text-align: center;
        margin: 0;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      nav {
        background-color: #000000;
        color: white;
        padding: 30px 20px;
      }

      nav h2 {
        margin-top: 0;
        margin-bottom: 20px;
        color: white;
      }

      nav a {
        color: #f30000;
        text-decoration: none;
        font-size: 18px;
        padding: 8px 12px;
        transition: 0.3s;
        display: inline-block;
        margin: 5px 0;
      }

      header {
        padding: 30px 20px;
        background-color: #1b1b1b;
      }

      nav a:hover {
        color: rgb(255, 0, 0);
        background-color: #000625;
        border-radius: 5px;
      }

      footer {
        margin: 0;
        background-color: #080808;
        color: white;
        padding: 20px;
        max-width: 100%;
        margin-top: auto;
      }

      nav br {
        display: none;
      }

    </style>
  </head>

  <body>
    <header>
      <h1>O Contato da dupla</h1>
    </header>
    <nav>
      <h2>Contato:</h2>

      <a href="/">(41) 99999-9999</a>
      <br />
      <br />

      <a href="/">contato@gmail.com</a>
      <br />
      <br />

      <a href="/home">Início</a>
      <br />
      <br />
    </nav>
    
    <footer>
      <p>&copy; 2026 PrimeiroServer. Gustavo Iavorski e Lucas José Wenski.</p>
    </footer>
  </body>
</html>
